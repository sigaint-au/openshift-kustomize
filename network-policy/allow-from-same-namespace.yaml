---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-same-namespace
spec:
  # Every pod in this project.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Pods in this project talk to each other.
    - from:
        - podSelector: {}
  egress:
    # Replies and same-project calls need Egress open too,
    # because the cluster baseline denies pod-to-pod egress.
    - to:
        - podSelector: {}
