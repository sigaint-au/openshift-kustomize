---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Lets cluster Prometheus scrape your /metrics endpoints.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
      # Open to all pod ports so the template works on drop-in.
      # Restrict ports: uncomment and set your metrics port.
      # ports:
      #   - protocol: TCP
      #     port: 9090
