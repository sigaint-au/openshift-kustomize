---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: example-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: hub-store
  target:
    name: pulled-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: my-secret
        property: password