---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hub-store
spec:
  provider:
    kubernetes:
      # Hub API server URL.  Override per cluster.
      server:
        url: "https://REPLACE_HUB_API_URL:6443"
        # PEM-encoded CA certificate of the hub cluster, base64.
        caBundle: "REPLACE_HUB_CA_BUNDLE_BASE64"
      auth:
        token:
          bearerToken:
            name: hub-token
            key: token
      # EXACTLY one remote namespace.  The store cannot read secrets
      # outside this namespace.  Override per cluster.
      remoteNamespace: "REPLACE_REMOTE_NAMESPACE"
  # Uncomment to restrict which namespaces on this managed cluster can
  # reference the store.  Each entry is an OR: if any selector matches,
  # the namespace is allowed.  Set in the overlay, not here.
  # conditions:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: my-app