---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hub overlay for cluster-001a.
#
# Creates the dedicated namespace eso-cluster-001a and places the
# eso-reader ServiceAccount, Role, and RoleBinding inside it.
#
# Apply:
#   oc apply -k ./external-secrets-store/hub/overlays/cluster-001a
#
# Preview:
#   kubectl kustomize ./external-secrets-store/hub/overlays/cluster-001a

namespace: eso-cluster-001a

resources:
  - ../../base
  - namespace.yaml