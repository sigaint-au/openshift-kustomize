---
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: container-runtime-socket
spec:
  policyName: Mount Container Runtime Socket
  description: >-
    Alert on deployments that mount the container runtime socket
    (Docker, CRI-O, or containerd socket).
  rationale: >-
    A process that can reach the runtime socket can create new
    containers (including privileged ones with host mounts), and
    inspect every other container on the same host. This is a
    direct container escape vector.
  remediation: >-
    Do not mount the runtime socket. If a workload needs runtime
    access (CI runner, build agent), isolate it to a dedicated
    namespace and document the exception.
  categories:
    - Security Best Practices
  lifecycleStages:
    - DEPLOY
  severity: HIGH_SEVERITY
  disabled: false
  exclusions:
    - name: Exclude system namespaces
      deployment:
        scope:
          namespace: ^kube.*|^openshift.*|^redhat.*|^istio-system$|^gitops-pipelines$
  policySections:
    - sectionName: Runtime Socket Check
      policyGroups:
        - fieldName: Volume Source
          values:
            - value: /var/run/docker.sock
            - value: /var/run/crio/crio.sock
            - value: /run/crio/crio.sock