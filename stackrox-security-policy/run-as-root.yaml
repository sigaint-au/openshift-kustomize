---
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: run-as-root
spec:
  policyName: Container Running as Root
  description: >-
    Alert on containers that run as the root user (UID 0) or use
    images that don't declare a non-root user.
  rationale: >-
    Root inside a container increases the blast radius of a compromise.
    A process that escapes the container or abuses a kernel
    vulnerability gets root-level access on the host.
  remediation: >-
    Add a USER directive to the Dockerfile or set
    securityContext.runAsNonRoot: true with a non-zero
    securityContext.runAsUser in the pod spec.
  categories:
    - Security Best Practices
  lifecycleStages:
    - BUILD
    - DEPLOY
  severity: MEDIUM_SEVERITY
  disabled: false
  exclusions:
    - name: Exclude system namespaces
      deployment:
        scope:
          namespace: ^kube.*|^openshift.*|^redhat.*|^istio-system$|^gitops-pipelines$
  policySections:
    - sectionName: Root User Check
      policyGroups:
        - fieldName: Image User
          values:
            - value: "0"
            - value: root