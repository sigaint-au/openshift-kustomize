---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay for the default-deny baseline.
# Adds audit logging of allow and deny verdicts.
#
# Deploy:
#   oc apply -k ./baseline-admin-network-policy/overlays/production
# Preview:
#   kubectl kustomize ./baseline-admin-network-policy/overlays/production

resources:
  - ../../base

labels:
  - pairs:
      environment: production
    includeSelectors: false

patches:
  - path: logging-patch.yaml
